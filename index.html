<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de l'eau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_a_photo,analytics,delete,info,photo_library,science" />
  <link rel="stylesheet" href="styles.css">
</head>
<body data-display-mode="current">
  <main class="device">
    <header class="bezel">
      <div class="header-main">
        <div>
          <h1 class="lcd">CONTROLE EAU SPA</h1>
          <p class="sub" id="mode-description">Entre les valeurs dans l'ordre ou l'appareil les affiche. Le retour se met a jour a chaque champ.</p>
        </div>
        <button class="mode-switch" id="mode-switch" type="button" aria-pressed="false" aria-label="Passer en mode lecture de bandelette">
          <span class="mode-option mode-option-current">
            <span class="mode-logo mode-logo-current" aria-hidden="true">M1</span>
            YUMKI
          </span>
          <span class="mode-knob" aria-hidden="true"></span>
          <span class="mode-option mode-option-strip">
            <span class="mode-logo mode-logo-strip" aria-hidden="true"></span>
            Bandelette
          </span>
        </button>
      </div>
    </header>

    <div id="app-content"></div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
