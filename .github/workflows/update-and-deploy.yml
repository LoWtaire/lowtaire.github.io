name: Actualiser les salles et déployer

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      TZ: Europe/Paris
      HORIZON_DAYS: "60"
      PAST_DAYS: "1"
      UNIVLOR_ICS_URL: ${{ secrets.ICS_URL_UNIVLOR || vars.ICS_URL_UNIVLOR }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la configuration ADE
        shell: bash
        run: |
          test -n "$UNIVLOR_ICS_URL" || {
            echo "::error::ICS_URL_UNIVLOR est absente"
            exit 1
          }

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --prefix IsAnEmptyRoom/adeb --no-audit --no-fund

      - name: Actualiser Université de Lorraine
        working-directory: IsAnEmptyRoom/adeb
        env:
          ICS_URL: ${{ env.UNIVLOR_ICS_URL }}
          OUTPUT_FILE: ../data/univlor.json
        run: npm run generate

      - name: Contrôler les données
        run: |
          node IsAnEmptyRoom/scripts/validate-data.mjs \
            IsAnEmptyRoom/data/univlor.json

      - name: Préparer le site
        shell: bash
        run: |
          mkdir -p _site/adeb _site/data

          cp IsAnEmptyRoom/index.html _site/

          cp IsAnEmptyRoom/adeb/index.html \
             IsAnEmptyRoom/adeb/campus.json \
             _site/adeb/

          cp -R IsAnEmptyRoom/adeb/assets _site/adeb/
          cp -R IsAnEmptyRoom/plan _site/
          cp IsAnEmptyRoom/data/univlor.json _site/data/

          touch _site/.nojekyll

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger l’artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
