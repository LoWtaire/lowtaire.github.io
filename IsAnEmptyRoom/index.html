<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>IsAnEmptyRoom — trouver une salle libre</title>
  <style>
    :root { color-scheme:light; --ink:#20202a; --muted:#666473; --purple:#7c3aed; --card:#fff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#f5eafe,#ead7fb); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(760px,100%); padding:clamp(24px,5vw,48px); border:1px solid #fff9; border-radius:24px; background:#ffffffd9; box-shadow:0 22px 60px #4c1d9520; backdrop-filter:blur(10px); }
    h1 { margin:0 0 10px; font-size:clamp(2rem,6vw,3.7rem); letter-spacing:-.04em; }
    .lead { margin:0 0 30px; color:var(--muted); font-size:1.08rem; }
    .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
    a { display:block; min-height:130px; padding:22px; border:1px solid #e7def2; border-radius:17px; background:var(--card); color:inherit; text-decoration:none; transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease; }
    a:hover { transform:translateY(-2px); border-color:#b99ae6; box-shadow:0 12px 25px #4c1d9518; }
    a:focus-visible { outline:3px solid #a78bfa; outline-offset:3px; }
    strong { display:block; margin-bottom:8px; color:var(--purple); font-size:1.18rem; }
    span { color:var(--muted); line-height:1.45; }
  </style>
</head>
<body>
  <main>
    <h1>IsAnEmptyRoom</h1>
    <p class="lead">Consulte l’occupation des salles du campus Bridoux et trouve rapidement un espace libre.</p>
    <div class="choices">
      <a href="./adeb/">
        <strong>Liste des salles</strong>
        <span>Disponibilités actuelles, recherche et planning de la journée.</span>
      </a>
      <a href="./plan/">
        <strong>Plan de Bridoux</strong>
        <span>Vue interactive du campus avec l’état des salles.</span>
      </a>
    </div>
  </main>
</body>
</html>
