name: Actualiser les salles et déployer

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Europe/Paris
      HORIZON_DAYS: "60"
      PAST_DAYS: "1"
      UNIVLOR_ICS_URL: ${{ secrets.ICS_URL_UNIVLOR || vars.ICS_URL_UNIVLOR }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la configuration ADE
        shell: bash
        run: |
          test -n "$UNIVLOR_ICS_URL" || { echo "::error::ICS_URL_UNIVLOR est absente"; exit 1; }

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adeb/package-lock.json

      - name: Installer les dépendances
        run: npm ci --prefix adeb

      - name: Actualiser Université de Lorraine
        env:
          ICS_URL: ${{ env.UNIVLOR_ICS_URL }}
          OUTPUT_FILE: ../data/univlor.json
        run: npm --prefix adeb run generate

      - name: Contrôler les données
        run: node scripts/validate-data.mjs data/univlor.json

      - name: Préparer le site
        shell: bash
        run: |
          mkdir -p _site/adeb _site/data
          cp index.html _site/
          cp adeb/index.html adeb/campus.json _site/adeb/
          cp -R adeb/assets _site/adeb/
          cp -R plan _site/
          cp data/univlor.json _site/data/
          touch _site/.nojekyll

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger l’artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
