name: Publier et actualiser le planning
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le parseur
        run: python -m unittest discover -s tests -v
      - name: Récupérer le calendrier ULCO
        run: python scripts/sync_calendar.py
      - uses: actions/configure-pages@v5
      - name: Préparer le site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css favicon.svg _site/
          cp data/calendar.ics data/schedule.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
